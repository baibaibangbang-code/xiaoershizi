<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>儿童识字小报生成器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>儿童识字小报生成器</h1>

    <div class="form-card">
      <div class="form-group">
        <label>主题/场景</label>
        <input type="text" id="theme" placeholder="如：超市、医院、公园" />
      </div>
      <div class="form-group">
        <label>小报标题</label>
        <input type="text" id="title" placeholder="如：《走进超市》" />
      </div>
      <button id="generateBtn">生成小报</button>
    </div>

    <div id="status" class="status-msg"></div>
    <div id="result" class="result-area"></div>
  </div>

  <script src="app.js?v=2"></script>
</body>
</html>
